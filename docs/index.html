<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Hustle daily football predictions: today's slate, tickets and an audit of yesterday's picks.">
<title>Hustle Daily Slate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one narrow matchday-programme column; slate first, audit below, tickets as the only boxed objects. */
:root {
  --bg: #F1F3F0;
  --surface: #FFFFFF;
  --ink: #15201B;
  --muted: #5A6760;
  --line: #D3DAD5;
  --accent: #2346B8;
  --accent-soft: #E3E8F8;
  --win: #1E7A40;
  --win-soft: #E1F1E6;
  --loss: #B42318;
  --loss-soft: #FBE4E1;
  --pending: #8A6A12;
  --font-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1513; --surface: #17201C; --ink: #E6ECE8; --muted: #93A29A; --line: #2A3631;
    --accent: #8EA6FF; --accent-soft: #1E2847; --win: #6FD08F; --win-soft: #15301F;
    --loss: #FF8A7A; --loss-soft: #3A1915; --pending: #E2C064; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1513; --surface: #17201C; --ink: #E6ECE8; --muted: #93A29A; --line: #2A3631;
  --accent: #8EA6FF; --accent-soft: #1E2847; --win: #6FD08F; --win-soft: #15301F;
  --loss: #FF8A7A; --loss-soft: #3A1915; --pending: #E2C064; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 56px;
}
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px; }
h1, h2, h3, h4 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.05; }
a { color: var(--accent); }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Masthead */
.mast { display: flex; flex-direction: column; gap: 10px; border-bottom: 3px solid var(--ink); padding-bottom: 18px; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 15px; letter-spacing: 0.32em; text-transform: uppercase; color: var(--accent); }
.mast h1 { font-size: clamp(40px, 9vw, 64px); font-weight: 800; text-transform: uppercase; letter-spacing: 0.01em; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); font-size: 14px; }
.meta b { color: var(--ink); font-family: var(--font-data); font-weight: 700; }
.days { display: flex; flex-wrap: wrap; gap: 8px; }
.days button {
  font: 600 13px var(--font-body); color: var(--muted); background: transparent;
  border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; cursor: pointer;
}
.days button[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); }

/* Sections */
section { display: flex; flex-direction: column; gap: 22px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h2 { font-size: 30px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; }
.sec-head .note { color: var(--muted); font-size: 14px; }
.comp { display: flex; flex-direction: column; gap: 14px; }
h3 { font-size: 21px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--accent); }
h4 { font-family: var(--font-data); font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.window { display: flex; flex-direction: column; gap: 6px; }

/* Pick lines */
ol.picks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.pick {
  display: grid; grid-template-columns: 2.2em minmax(0, 1fr) auto; gap: 4px 12px; align-items: baseline;
  padding: 9px 0; border-bottom: 1px solid var(--line);
}
.pick .n { font-family: var(--font-data); font-weight: 700; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pick .fx { min-width: 0; }
.pick .fx strong { font-weight: 600; }
.pick .mk { color: var(--muted); }
.pick .odds { font-family: var(--font-data); font-weight: 700; font-variant-numeric: tabular-nums; }
.pick .res { grid-column: 2 / 4; font-size: 14px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.pill { font: 700 11px var(--font-data); letter-spacing: 0.08em; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; }
.pill.won { color: var(--win); background: var(--win-soft); }
.pill.lost { color: var(--loss); background: var(--loss-soft); }
.pill.unverified, .pill.pending { color: var(--pending); background: var(--accent-soft); }
.passes { font-size: 14px; color: var(--muted); margin: 0; }
.passes b { color: var(--ink); }

/* Tickets */
.tickets { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.ticket { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.ticket h3 { color: var(--ink); font-size: 20px; }
.ticket ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 15px; }
.ticket li { display: flex; justify-content: space-between; gap: 10px; }
.ticket li span:first-child { min-width: 0; }
.ticket li span:last-child, .ticket .total b { font-family: var(--font-data); font-weight: 700; font-variant-numeric: tabular-nums; }
.ticket .total { border-top: 1px dashed var(--line); padding-top: 8px; display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); }
.ticket .total b { color: var(--ink); font-size: 16px; }
.reminder { font-weight: 600; margin: 0; padding: 12px 14px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 4px 4px 0; }

/* Audit */
.scoreline { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 15px; }
.scoreline span b { font-family: var(--font-data); font-size: 20px; margin-right: 4px; font-variant-numeric: tabular-nums; }
.lessons { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; }
.sourcenote { font-size: 13px; color: var(--muted); margin: 0; }
footer { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; display: flex; flex-direction: column; gap: 6px; }
@media (max-width: 420px) {
  .pick { grid-template-columns: 1.8em minmax(0, 1fr) auto; }
  h2 { font-size: 26px; }
}
</style>
</head>
<body>

<div class="wrap">
  <header class="mast">
    <div class="brand">Hustle</div>
    <h1 id="title">Daily Slate</h1>
    <div class="meta" id="meta"></div>
    <div class="days" id="days" aria-label="Choose a day"></div>
  </header>
  <main id="app" class="wrap" style="gap:40px"></main>
  <footer>
    <span>Picks are opinions, not guarantees. 18+ only. Stake only what you can afford to lose.</span>
    <span>Fixtures checked against UEFA's official lists. Odds as listed by the bookmaker when the slate was built and will move.</span>
  </footer>
</div>

<script>
/* ===== DATA: one entry per day, newest first. Daily update = add an entry and fill in yesterday's results. ===== */
const SLATES = [
  {
    date: "2026-11-05",
    label: "Thursday 5 November 2026",
    built: "Built 06:10 UK",
    comps: [
      { name: "UEFA Europa League", windows: [
        { ko: "17:45 UK", picks: [
          { n: 1, fx: "Crystal Palace v Hoffenheim", mk: "Both Teams to Score: Yes", odds: "1.50" },
          { n: 2, fx: "AC Milan v Ferencváros", mk: "Over 1.5 Goals", odds: "1.16" },
          { n: 3, fx: "Real Sociedad v Lyon", mk: "2nd Half Over 0.5 Goals", odds: "1.18" }
        ]},
        { ko: "20:00 UK", picks: [
          { n: 4, fx: "Benfica v Lech Poznań", mk: "Home Win & Over 1.5 Goals", odds: "1.19" },
          { n: 5, fx: "Celtic v Beşiktaş", mk: "Over 2.5 Goals", odds: "1.53" }
        ]}
      ]},
      { name: "UEFA Conference League", windows: [
        { ko: "17:45 UK", picks: [
          { n: 6, fx: "Midtjylland v Ajax", mk: "Both Teams to Score: Yes", odds: "1.45" },
          { n: 7, fx: "Crvena Zvezda v Inter d'Escaldes", mk: "Home Win & Over 1.5 Goals", odds: "1.12" },
          { n: 8, fx: "Atalanta v Kairat Almaty", mk: "2nd Half Over 0.5 Goals", odds: "1.14" }
        ]},
        { ko: "20:00 UK", picks: [
          { n: 9, fx: "FC Twente v Pafos", mk: "Over 2.5 Goals", odds: "1.37" },
          { n: 10, fx: "Panathinaikos v CSKA Sofia", mk: "Double Chance 1X", odds: "1.12" },
          { n: 11, fx: "Copenhagen v Iberia 1999", mk: "Over 1.5 Goals", odds: "1.15" }
        ]}
      ]}
    ],
    passes: "Leverkusen v Marseille (home attack injury list, home record unverified), Sunderland v Dinamo Zagreb (poor form, rotation expected), AZ v Juventus (away favourite, no goals angle), Sturm Graz v Celje, Anderlecht v Salzburg, Celta v Union SG, Monaco v Nordsjælland (four league games without a win), and every other fixture with no rule-compliant edge.",
    tickets: [
      { name: "Safest 4-leg", legs: [
        ["Benfica v Lech: Home & Over 1.5", "1.19"],
        ["Crvena Zvezda v Inter d'Escaldes: Home & Over 1.5", "1.12"],
        ["Milan v Ferencváros: Over 1.5", "1.16"],
        ["Copenhagen v Iberia 1999: Over 1.5", "1.15"]
      ], total: "1.78" },
      { name: "Goals 4-leg", legs: [
        ["Midtjylland v Ajax: BTTS Yes", "1.45"],
        ["Crystal Palace v Hoffenheim: BTTS Yes", "1.50"],
        ["Twente v Pafos: Over 2.5", "1.37"],
        ["Celtic v Beşiktaş: Over 2.5", "1.53"]
      ], total: "4.56" }
    ],
    results: null,
    audit: {
      of: "Wednesday 4 November 2026",
      note: "Settled the 8-leg slip from 4 Nov (booking code GZCH1E). Flashscore pages could not be loaded for checking, so each result is verified against ESPN or CBS Sports, linked below.",
      picks: [
        { fx: "AEK Athens v Real Madrid", mk: "Over 2.5 Goals", odds: "1.28", score: "2–3", status: "won", src: "https://www.espn.com/soccer/scoreboard/_/league/uefa.champions", srcName: "ESPN" },
        { fx: "Fenerbahçe v Liverpool", mk: "Both Teams to Score: Yes", odds: "1.54", score: "3–2", status: "won", src: "https://www.espn.com/soccer/scoreboard/_/league/uefa.champions", srcName: "ESPN" },
        { fx: "RB Leipzig v Man City", mk: "Over 2.5 Goals", odds: "1.32", score: "2–3", status: "won", src: "https://www.cbssports.com/soccer/news/uefa-champions-league-schedule-matchday-4/", srcName: "CBS Sports" },
        { fx: "Viking FK v Sabah", mk: "Home Win & Over 1.5 Goals", odds: "1.48", score: "4–1", status: "won", src: "https://www.espn.com/soccer/schedule/_/league/uefa.champions", srcName: "ESPN" },
        { fx: "Borussia Dortmund v Real Betis", mk: "Both Teams to Score: Yes", odds: "1.54", score: "2–1", status: "won", src: "https://www.espn.com/soccer/match/_/gameId/401915304/real-betis-borussia-dortmund", srcName: "ESPN" },
        { fx: "Lens v Como", mk: "Over 2.5 Goals", odds: "1.55", score: "1–9", status: "won", src: "https://www.espn.com/soccer/schedule/_/league/uefa.champions", srcName: "ESPN" },
        { fx: "PSV v Club Brugge", mk: "Both Teams to Score: Yes", odds: "1.35", score: "1–2", status: "won", src: "https://www.espn.com/soccer/schedule/_/league/uefa.champions", srcName: "ESPN" },
        { fx: "Slavia Prague v Arsenal", mk: "Over 1.5 Goals", odds: "1.17", score: "1–2", status: "won", src: "https://www.cbssports.com/soccer/news/uefa-champions-league-schedule-matchday-4/", srcName: "CBS Sports" }
      ],
      tickets: [ { name: "8-leg accumulator (GZCH1E)", total: "14.52", landed: true } ],
      lessons: [
        "8 from 8 is variance. Nothing in the process changes because of it.",
        "Yesterday's slip had no passes list and no 4-leg tickets. From today every slate follows the rulebook format.",
        "Leg 8's fixture name was lost in a cropped screenshot. Every pick is now recorded in text the moment it is posted."
      ]
    }
  }
];

/* ===== RENDER ===== */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function countPicks(sl) { return sl.comps.reduce((a, c) => a + c.windows.reduce((b, w) => b + w.picks.length, 0), 0); }

function resultFor(sl, n) { return sl.results && sl.results[n]; }

function pickLine(p, res) {
  let extra = "";
  if (res) {
    extra = `<div class="res"><span class="pill ${res.status}">${esc(res.status)}</span><span>FT ${esc(res.score || "–")}</span>${res.src ? `<a href="${esc(res.src)}" target="_blank" rel="noopener">${esc(res.srcName || "source")}</a>` : ""}</div>`;
  }
  return `<li class="pick"><span class="n">${p.n}</span><span class="fx"><strong>${esc(p.fx)}</strong> <span class="mk">· ${esc(p.mk)}</span></span><span class="odds">${esc(p.odds)}</span>${extra}</li>`;
}

function renderSlate(sl) {
  const comps = sl.comps.map(c => `
    <div class="comp">
      <h3>${esc(c.name)}</h3>
      ${c.windows.map(w => `
        <div class="window">
          <h4>Kickoff ${esc(w.ko)}</h4>
          <ol class="picks">${w.picks.map(p => pickLine(p, resultFor(sl, p.n))).join("")}</ol>
        </div>`).join("")}
    </div>`).join("");

  const tickets = sl.tickets.map(t => `
    <div class="ticket">
      <h3>${esc(t.name)}</h3>
      <ul>${t.legs.map(l => `<li><span>${esc(l[0])}</span><span>${esc(l[1])}</span></li>`).join("")}</ul>
      <div class="total"><span>Combined odds</span><b>${esc(t.total)}</b></div>
    </div>`).join("");

  return `
    <section aria-labelledby="slate-h">
      <div class="sec-head"><h2 id="slate-h">The Slate</h2><span class="note">${countPicks(sl)} picks · UK kickoff times</span></div>
      ${comps}
      <p class="passes"><b>Passes:</b> ${esc(sl.passes)}</p>
    </section>
    <section aria-labelledby="tix-h">
      <div class="sec-head"><h2 id="tix-h">Tickets</h2></div>
      <div class="tickets">${tickets}</div>
      <p class="reminder">Check kickoff times and team news before staking. Odds move.</p>
    </section>`;
}

function renderAudit(a) {
  if (!a) return "";
  const won = a.picks.filter(p => p.status === "won").length;
  const lost = a.picks.filter(p => p.status === "lost").length;
  const settled = won + lost;
  const rate = settled ? Math.round(won / settled * 100) + "%" : "–";
  const lines = a.picks.map((p, i) => `
    <li class="pick"><span class="n">${i + 1}</span><span class="fx"><strong>${esc(p.fx)}</strong> <span class="mk">· ${esc(p.mk)}</span></span><span class="odds">${esc(p.odds)}</span>
      <div class="res"><span class="pill ${p.status}">${esc(p.status)}</span><span>FT ${esc(p.score)}</span><a href="${esc(p.src)}" target="_blank" rel="noopener">${esc(p.srcName)}</a></div></li>`).join("");
  const tix = a.tickets.map(t => `<li>${esc(t.name)} at ${esc(t.total)}: <b>${t.landed ? "landed" : "did not land"}</b></li>`).join("");
  return `
    <section aria-labelledby="audit-h">
      <div class="sec-head"><h2 id="audit-h">Audit</h2><span class="note">${esc(a.of)}</span></div>
      <div class="scoreline">
        <span><b>${a.picks.length}</b>picks</span>
        <span><b style="color:var(--win)">${won}</b>won</span>
        <span><b style="color:var(--loss)">${lost}</b>lost</span>
        <span><b>${rate}</b>strike rate</span>
      </div>
      <p class="sourcenote">${esc(a.note)}</p>
      <ol class="picks">${lines}</ol>
      <div class="comp"><h4>Tickets</h4><ul class="lessons">${tix}</ul></div>
      <div class="comp"><h4>Lessons for the next slate</h4><ul class="lessons">${a.lessons.map(l => `<li>${esc(l)}</li>`).join("")}</ul></div>
    </section>`;
}

function show(date) {
  const sl = SLATES.find(s => s.date === date) || SLATES[0];
  $("#title").textContent = sl.label;
  $("#meta").innerHTML = `<span><b>${countPicks(sl)}</b> picks</span><span><b>${sl.comps.length}</b> competitions</span><span>${esc(sl.built)}</span>`;
  $("#days").innerHTML = SLATES.length > 1 ? SLATES.map(s => `<button type="button" data-d="${s.date}" aria-pressed="${s.date === sl.date}">${s.date.slice(8)}/${s.date.slice(5,7)}</button>`).join("") : "";
  $("#app").innerHTML = renderSlate(sl) + renderAudit(sl.audit);
  document.querySelectorAll("#days button").forEach(b => b.onclick = () => { location.hash = "d" + b.dataset.d; });
}
function fromHash() { const m = location.hash.match(/^#d(\d{4}-\d{2}-\d{2})$/); show(m ? m[1] : SLATES[0].date); }
window.addEventListener("hashchange", fromHash);
fromHash();
</script>
</body>
</html>
