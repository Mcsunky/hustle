<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Hustle daily football predictions: the Slate, booking codes, the Mega accumulator and a sourced audit of every pick.">
<meta name="theme-color" content="#0D1217">
<title>Hustle Daily Slate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one floodlit matchday column. Codes first, record second, then the Slate, tickets, Mega legs and audit. Single dark theme by choice. */
:root {
  color-scheme: dark;
  --bg: #0D1217;
  --panel: #151C23;
  --panel-2: #1B242D;
  --ink: #E9EEF2;
  --muted: #8E9BA7;
  --line: #26313B;
  --main: #7FA8FF;
  --main-soft: #1A2742;
  --gold: #F2B640;
  --gold-soft: #33280F;
  --win: #4FCB8D;
  --win-soft: #13301F;
  --loss: #F27561;
  --loss-soft: #3A1813;
  --pend: #C9B37A;
  --font-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 56px;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 36px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; line-height: 1.05; text-wrap: balance; }
a { color: var(--main); }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }

/* Masthead */
.mast { display: flex; flex-direction: column; gap: 12px; }
.mast-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 15px; letter-spacing: 0.34em; text-transform: uppercase; color: var(--gold); }
.updated { font-size: 13px; color: var(--muted); }
.mast h1 { font-size: clamp(36px, 8vw, 56px); font-weight: 800; text-transform: uppercase; }
.days { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.days button {
  flex: none; font: 600 13px var(--font-body); color: var(--muted); background: var(--panel);
  border: 1px solid var(--line); border-radius: 999px; padding: 5px 13px; cursor: pointer;
}
.days button[aria-pressed="true"] { color: var(--bg); background: var(--ink); border-color: var(--ink); }
.kick { font-size: 14px; color: var(--muted); }
.kick b { color: var(--ink); }

/* Codes */
.codes { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
.code-card { background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--c); border-radius: 8px; padding: 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.code-card.main { --c: var(--main); }
.code-card.mega { --c: var(--gold); }
.code-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.code-label { font: 700 12px var(--font-data); letter-spacing: 0.12em; text-transform: uppercase; color: var(--c); }
.code-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.code { font: 700 clamp(30px, 7vw, 38px) var(--font-data); letter-spacing: 0.08em; user-select: all; }
.copy { font: 700 14px var(--font-body); color: var(--bg); background: var(--c); border: 0; border-radius: 5px; padding: 9px 14px; cursor: pointer; }
.code-meta { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 14px; color: var(--muted); }
.code-meta b { color: var(--ink); font-family: var(--font-data); font-weight: 700; }
.code-note { font-size: 13px; color: var(--muted); margin: 0; }

/* Pills */
.pill { font: 700 11px var(--font-data); letter-spacing: 0.08em; text-transform: uppercase; padding: 3px 8px; border-radius: 4px; white-space: nowrap; }
.pill.won, .pill.landed { color: var(--win); background: var(--win-soft); }
.pill.lost { color: var(--loss); background: var(--loss-soft); }
.pill.pending, .pill.unverified { color: var(--pend); background: var(--panel-2); }

/* Record */
.record { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.stat { background: var(--panel); padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat .v { font: 700 24px var(--font-data); font-variant-numeric: tabular-nums; }
.stat .k { font-size: 12px; color: var(--muted); letter-spacing: 0.04em; }
@media (max-width: 560px) { .record { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* Sections */
section { display: flex; flex-direction: column; gap: 18px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-bottom: 2px solid var(--ink); padding-bottom: 8px; }
h2 { font-size: 30px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; }
.sec-head .note { color: var(--muted); font-size: 14px; }
.comp { display: flex; flex-direction: column; gap: 6px; }
h3 { font-size: 19px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--main); display: flex; gap: 10px; align-items: baseline; }
h3 .ko { font: 500 12px var(--font-data); letter-spacing: 0.06em; color: var(--muted); }
.mega-sec h3 { color: var(--gold); }

ol.picks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.pick { display: grid; grid-template-columns: 2em minmax(0, 1fr) auto; gap: 4px 12px; align-items: baseline; padding: 10px 0; border-bottom: 1px solid var(--line); }
.pick .n { font: 700 13px var(--font-data); color: var(--muted); }
.pick .fx { min-width: 0; }
.pick .fx strong { font-weight: 600; }
.pick .mk { color: var(--muted); display: block; font-size: 15px; }
.pick .odds { font: 700 16px var(--font-data); font-variant-numeric: tabular-nums; }
.pick .res { grid-column: 2 / 4; font-size: 14px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.passes, .settled { font-size: 14px; color: var(--muted); margin: 0; }
.passes b { color: var(--ink); }
.settled { color: var(--ink); background: var(--panel); border-left: 3px solid var(--main); padding: 10px 12px; border-radius: 0 6px 6px 0; }

/* Tickets */
.tickets { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.ticket { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.ticket h3 { color: var(--ink); font-size: 19px; }
.ticket ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 15px; }
.ticket li { display: flex; justify-content: space-between; gap: 10px; }
.ticket li span:first-child { min-width: 0; }
.ticket li span:last-child, .ticket .total b { font-family: var(--font-data); font-weight: 700; font-variant-numeric: tabular-nums; }
.ticket .total { border-top: 1px dashed var(--line); padding-top: 8px; display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); }
.ticket .total b { color: var(--ink); font-size: 16px; }
.reminder { font-weight: 600; margin: 0; padding: 11px 14px; border-left: 3px solid var(--gold); background: var(--gold-soft); border-radius: 0 6px 6px 0; }
.longshot { margin: 0; font-size: 14px; color: var(--muted); }

/* Audit */
.scoreline { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 15px; }
.scoreline b { font: 700 20px var(--font-data); margin-right: 4px; }
.lessons { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; }
.sub-h { font: 700 12px var(--font-data); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 0; }
footer { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; display: flex; flex-direction: column; gap: 6px; }
@media (prefers-reduced-motion: no-preference) { .copy { transition: filter .15s; } .copy:hover { filter: brightness(1.1); } }
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div class="mast-top"><span class="brand">Hustle</span><span class="updated" id="updated"></span></div>
    <h1 id="title">Daily Slate</h1>
    <div class="kick" id="kick"></div>
    <nav class="days" id="days" aria-label="Choose a day"></nav>
  </header>
  <main id="app" class="wrap"></main>
  <footer>
    <span>Picks are opinions, not guarantees. 18+ only. Stake only what you can afford to lose.</span>
    <span>Fixtures are checked against official lists. Odds are the bookmaker's when the slate was built and will move. Kickoff times are UK time.</span>
  </footer>
</div>
<script>
function startHustle() {
const SLATES = window.SLATES || [];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const allPicks = sl => sl.comps.flatMap(c => c.windows.flatMap(w => w.picks.map(p => ({...p, ko: w.ko, comp: c.name}))));

/* Track record, from every settled day */
function record() {
  let won = 0, lost = 0, accW = 0, accN = 0, megaW = 0, megaN = 0;
  const auditedOf = new Set();
  SLATES.forEach(sl => {
    if (!sl.audit) return;
    auditedOf.add(sl.audit.of);
    sl.audit.picks.forEach(p => { if (p.status === "won") won++; else if (p.status === "lost") lost++; });
    (sl.audit.tickets || []).forEach(t => { if (/accumulator/i.test(t.name)) { accN++; if (t.landed) accW++; } });
  });
  SLATES.forEach(sl => {
    if (sl.results && !auditedOf.has(sl.label)) {
      const rs = Object.values(sl.results);
      rs.forEach(r => { if (r.status === "won") won++; else if (r.status === "lost") lost++; });
      if (sl.acca && rs.length === allPicks(sl).length && rs.every(r => r.status !== "unverified")) { accN++; if (rs.every(r => r.status === "won")) accW++; }
    }
    if (sl.mega && sl.mega.landed !== null && sl.mega.landed !== undefined) { megaN++; if (sl.mega.landed) megaW++; }
  });
  const rate = won + lost ? Math.round(won / (won + lost) * 100) + "%" : "–";
  return { won, lost, rate, acc: accN ? `${accW}/${accN}` : "–", mega: megaN ? `${megaW}/${megaN}` : "0/0" };
}

/* Kickoff times are UK time on the slate date. UK is on GMT Nov–Mar. */
function koDate(date, ko) { const m = String(ko).match(/(\d{1,2}):(\d{2})/); if (!m) return null; return new Date(date + "T" + m[1].padStart(2,"0") + ":" + m[2] + ":00Z"); }
function kickLine(sl) {
  const times = allPicks(sl).map(p => koDate(sl.date, p.ko)).concat((sl.mega?.legs || []).map(l => koDate(sl.date, l.ko))).filter(Boolean).sort((a,b) => a - b);
  if (!times.length) return "";
  const now = new Date(), first = times[0], last = times[times.length - 1];
  const fmt = ms => { const m = Math.round(ms / 60000), h = Math.floor(m / 60); return h ? `${h}h ${m % 60}m` : `${m}m`; };
  if (now < first) return `First kickoff <b>${first.toISOString().slice(11,16)} UK</b>, in <b>${fmt(first - now)}</b>. Load codes before then.`;
  if (now < new Date(last.getTime() + 115 * 60000)) return `<b>Matches in play.</b> Last kickoff ${last.toISOString().slice(11,16)} UK.`;
  return sl.settled ? "All matches finished and settled." : "All matches finished. Audit runs about an hour after the last one.";
}

function copyBtn(code, cls) { return `<button type="button" class="copy" data-code="${esc(code)}">Copy</button>`; }
function statusPill(s) { return s ? `<span class="pill ${esc(s)}">${esc(s)}</span>` : ""; }

function codesBlock(sl) {
  const cards = [];
  if (sl.acca) {
    const rs = sl.results ? Object.values(sl.results) : [];
    const n = allPicks(sl).length;
    let st = "pending";
    if (rs.some(r => r.status === "lost")) st = "lost"; else if (rs.length === n && rs.every(r => r.status === "won")) st = "landed";
    cards.push(`<div class="code-card main">
      <div class="code-head"><span class="code-label">Main accumulator</span>${statusPill(st)}</div>
      <div class="code-row"><span class="code">${esc(sl.acca.code)}</span>${copyBtn(sl.acca.code)}</div>
      <div class="code-meta"><span><b>${sl.acca.legs}</b> legs</span><span>odds <b>${esc(sl.acca.odds)}</b></span><span>booked ${esc(sl.acca.booked)}</span></div>
      ${sl.acca.note ? `<p class="code-note">${esc(sl.acca.note)}</p>` : ""}
    </div>`);
  }
  if (sl.mega) {
    const st = sl.mega.landed === true ? "landed" : sl.mega.landed === false ? "lost" : "pending";
    cards.push(`<div class="code-card mega">
      <div class="code-head"><span class="code-label">Mega accumulator · long shot</span>${statusPill(st)}</div>
      <div class="code-row"><span class="code">${esc(sl.mega.code)}</span>${copyBtn(sl.mega.code)}</div>
      <div class="code-meta"><span><b>${sl.mega.legs.length}</b> legs</span><span>odds <b>${esc(sl.mega.odds)}</b></span><span>booked ${esc(sl.mega.booked)}</span></div>
    </div>`);
  }
  return cards.length ? `<div class="codes">${cards.join("")}</div>` : "";
}

function recordBlock() {
  const r = record();
  return `<div class="record" aria-label="Track record">
    <div class="stat"><span class="v">${r.won}–${r.lost}</span><span class="k">Picks won–lost</span></div>
    <div class="stat"><span class="v">${r.rate}</span><span class="k">Strike rate</span></div>
    <div class="stat"><span class="v">${r.acc}</span><span class="k">Main accas landed</span></div>
    <div class="stat"><span class="v">${r.mega}</span><span class="k">Megas landed</span></div>
  </div>`;
}

function resLine(res) {
  if (!res) return "";
  return `<div class="res">${statusPill(res.status)}<span class="num">FT ${esc(res.score || "–")}</span>${res.src ? `<a href="${esc(res.src)}" target="_blank" rel="noopener">${esc(res.srcName || "source")}</a>` : ""}</div>`;
}
function pickLi(n, fx, mk, odds, res) {
  return `<li class="pick"><span class="n num">${esc(n)}</span><span class="fx"><strong>${esc(fx)}</strong><span class="mk">${esc(mk)}</span></span><span class="odds">${esc(odds)}</span>${resLine(res)}</li>`;
}

function slateBlock(sl) {
  const comps = sl.comps.map(c => c.windows.map(w => `
    <div class="comp">
      <h3>${esc(c.name)} <span class="ko">${esc(w.ko)}</span></h3>
      <ol class="picks">${w.picks.map(p => pickLi(p.n, p.fx, p.mk, p.odds, sl.results && sl.results[p.n])).join("")}</ol>
    </div>`).join("")).join("");
  return `<section aria-labelledby="slate-h">
    <div class="sec-head"><h2 id="slate-h">The Slate</h2><span class="note">${allPicks(sl).length} picks</span></div>
    ${sl.settled ? `<p class="settled">${esc(sl.settled)}</p>` : ""}
    ${comps}
    <p class="passes"><b>Passes:</b> ${esc(sl.passes)}</p>
  </section>`;
}

function ticketsBlock(sl) {
  return `<section aria-labelledby="tix-h">
    <div class="sec-head"><h2 id="tix-h">Tickets</h2></div>
    <div class="tickets">${sl.tickets.map(t => `
      <div class="ticket"><h3>${esc(t.name)}</h3>
        <ul>${t.legs.map(l => `<li><span>${esc(l[0])}</span><span>${esc(l[1])}</span></li>`).join("")}</ul>
        <div class="total"><span>Combined odds</span><b>${esc(t.total)}</b></div>
      </div>`).join("")}</div>
    <p class="reminder">Check kickoff times and team news before staking. Odds move.</p>
  </section>`;
}

function megaBlock(sl) {
  const m = sl.mega; if (!m) return "";
  return `<section class="mega-sec" aria-labelledby="mega-h">
    <div class="sec-head"><h2 id="mega-h">Mega Legs</h2><span class="note">${m.legs.length} legs · odds ${esc(m.odds)}</span></div>
    <p class="longshot">Same bans as the Slate, longer prices. Most days a slip at these odds loses, so it's tracked separately from the Slate's record.</p>
    <ol class="picks">${m.legs.map((l, i) => pickLi(i + 1, l.fx + " · " + l.ko, l.comp + " · " + l.mk, l.odds, m.results && m.results[i])).join("")}</ol>
  </section>`;
}

function auditBlock(a) {
  if (!a) return "";
  const won = a.picks.filter(p => p.status === "won").length, lost = a.picks.filter(p => p.status === "lost").length;
  const rate = won + lost ? Math.round(won / (won + lost) * 100) + "%" : "–";
  return `<section aria-labelledby="audit-h">
    <div class="sec-head"><h2 id="audit-h">Audit</h2><span class="note">${esc(a.of)}</span></div>
    <div class="scoreline"><span><b>${a.picks.length}</b>picks</span><span><b style="color:var(--win)">${won}</b>won</span><span><b style="color:var(--loss)">${lost}</b>lost</span><span><b>${rate}</b>strike rate</span></div>
    <p class="passes">${esc(a.note)}</p>
    <ol class="picks">${a.picks.map((p, i) => pickLi(i + 1, p.fx, p.mk, p.odds, p)).join("")}</ol>
    <p class="sub-h">Tickets</p>
    <ul class="lessons">${a.tickets.map(t => `<li>${esc(t.name)} at <span class="num">${esc(t.total)}</span>: <b>${t.landed ? "landed" : "did not land"}</b></li>`).join("")}</ul>
    <p class="sub-h">Lessons for the next slate</p>
    <ul class="lessons">${a.lessons.map(l => `<li>${esc(l)}</li>`).join("")}</ul>
  </section>`;
}

function show(date) {
  const sl = SLATES.find(s => s.date === date) || SLATES[0];
  if (!sl) { $("#app").innerHTML = "<p>No slate yet. The next one posts at 01:00 UK.</p>"; return; }
  $("#title").textContent = sl.label;
  $("#updated").textContent = sl.built + (sl.settled ? " · settled" : "");
  $("#kick").innerHTML = kickLine(sl);
  $("#days").innerHTML = SLATES.map(s => `<button type="button" data-d="${s.date}" aria-pressed="${s.date === sl.date}">${new Date(s.date + "T12:00:00Z").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", timeZone: "UTC" })}</button>`).join("");
  const body = sl.noSlate
    ? `<section aria-labelledby="slate-h"><div class="sec-head"><h2 id="slate-h">No Slate Today</h2></div><p class="settled">${esc(sl.noSlate)}</p></section>`
    : slateBlock(sl) + ticketsBlock(sl) + megaBlock(sl);
  $("#app").innerHTML = codesBlock(sl) + recordBlock() + body + auditBlock(sl.audit);
  document.querySelectorAll("#days button").forEach(b => b.onclick = () => { location.hash = "d" + b.dataset.d; });
  document.querySelectorAll(".copy").forEach(b => b.onclick = () => {
    const code = b.dataset.code, done = () => { b.textContent = "Copied"; setTimeout(() => b.textContent = "Copy", 1500); };
    const fallback = () => { const el = b.parentElement.querySelector(".code"); const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "Selected"; };
    try { navigator.clipboard.writeText(code).then(done, fallback); } catch (e) { fallback(); }
  });
}
function fromHash() { const m = location.hash.match(/^#d(\d{4}-\d{2}-\d{2})$/); show(m ? m[1] : SLATES[0]?.date); }
window.addEventListener("hashchange", fromHash);
fromHash();
setInterval(() => { const m = location.hash.match(/^#d(\d{4}-\d{2}-\d{2})$/); const sl = SLATES.find(s => s.date === (m ? m[1] : SLATES[0]?.date)); if (sl) $("#kick").innerHTML = kickLine(sl); }, 60000);
}
(function () {
  const sc = document.createElement("script");
  sc.src = "data.js?v=" + Date.now();
  sc.onload = startHustle;
  sc.onerror = () => { document.getElementById("app").innerHTML = "<p>Couldn't load today's slate. Refresh the page to try again.</p>"; };
  document.head.appendChild(sc);
})();
</script>
</body>
</html>
